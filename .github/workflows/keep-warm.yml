name: Keep Render backend warm

# Render 무료 플랜은 15분 유휴 시 인스턴스가 잠들어, 다음 요청에 콜드스타트(수십 초)가 걸린다.
# 학생 활동 시간대(대략 KST 06:00~04:00)에만 10분마다 /health 를 깨워 콜드스타트를 줄인다.
# 새벽(KST 04:00~06:00)만 생략 → 무료 인스턴스 시간(월 750h) 절약(약 660h/월 사용).
#
# 사용법: 저장소 Settings > Secrets and variables > Actions > Variables 탭에서
#   변수명 RENDER_HEALTH_URL = https://<렌더-앱>.onrender.com/health  추가.
#   (비밀이 아니라 공개돼도 무방한 값이라 secret이 아닌 variable로 둔다.)

on:
  schedule:
    - cron: "*/10 0-18,21-23 * * *" # UTC 기준. KST(UTC+9) 약 06:00~04:00 (KST 04~06시만 휴면)
  workflow_dispatch: {} # 수동 실행(설정 테스트용)

# 동시 실행 방지 — 스케줄이 겹쳐도 하나만
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          URL="${{ vars.RENDER_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::RENDER_HEALTH_URL 저장소 변수가 없습니다. Settings > Secrets and variables > Actions > Variables 에 추가하세요."
            exit 0   # 이메일 스팸 방지 위해 실패 대신 조용히 종료
          fi
          echo "Pinging $URL"
          # 콜드스타트면 첫 요청이 느리거나 502/503일 수 있음 — 깨우는 게 목적이라 상태코드로 실패 처리하지 않음
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
          echo "HTTP $code"
